name: Android
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '16111833'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK and native toolchain
        run: android --no-metrics sdk install 'platforms/android-37.2' 'build-tools/37.0.0' 'ndk/30.0.16248370' 'cmake/4.1.2'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build and verify
        run: bash gradlew assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: PhotoSphere-debug
          path: app/build/outputs/apk/debug/app-debug.apk

